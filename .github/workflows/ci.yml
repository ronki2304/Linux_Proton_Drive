name: CI

on:
  pull_request:
    branches: ["**"]

jobs:
  engine:
    name: Engine (type-check + tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        working-directory: engine
        run: bun install --frozen-lockfile

      - name: Type-check
        working-directory: engine
        run: bunx tsc --noEmit

      - name: Run tests
        working-directory: engine
        # Excludes src/__integration__/ — bun --path-ignore-patterns does not glob-expand, so this is the correct approach
        run: bun test --path-ignore-patterns '__integration__'

  ui-tests:
    name: UI tests (meson + pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blueprint-compiler python3-venv python3-pip meson ninja-build

      - name: Set up Python venv
        run: python3 -m venv ui/.venv && ui/.venv/bin/pip install pytest pyyaml

      - name: Meson setup
        run: meson setup ui builddir

      - name: Compile blueprints
        run: meson compile -C builddir

      - name: Run UI tests
        run: ui/.venv/bin/pytest ui/tests/
