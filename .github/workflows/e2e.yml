name: E2E Tests

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  e2e:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        working-directory: engine
        run: bun install --frozen-lockfile

      - name: Build binary
        working-directory: engine
        run: |
          mkdir -p dist
          bun build --compile src/main.ts --outfile=dist/engine

      - name: Run integration tests
        working-directory: engine
        env:
          PROTON_TEST_TOKEN: ${{ secrets.PROTON_TEST_TOKEN }}
          PROTON_TEST_FOLDER: ${{ secrets.PROTON_TEST_FOLDER }}
        run: |
          if find src/__integration__ -name "*.test.ts" | grep -q .; then
            bun test src/__integration__/
          else
            echo "No integration test files found in src/__integration__/ — skipping"
          fi
