name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        working-directory: engine
        run: bun install --frozen-lockfile

      - name: Run engine tests
        working-directory: engine
        run: bun run test

  release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate version consistency
        run: |
          TAG_BASE="${GITHUB_REF_NAME#v}"
          TAG_BASE="${TAG_BASE%%-*}"
          [ -f VERSION ] || { echo "ERROR: VERSION file not found at repo root. Run: ./scripts/bump-version.sh <version>"; exit 1; }
          FILE_VERSION="$(cat VERSION)"
          if [ "$TAG_BASE" != "$FILE_VERSION" ]; then
            echo "ERROR: Tag '${GITHUB_REF_NAME}' base version ('${TAG_BASE}') != VERSION file ('${FILE_VERSION}')."
            echo "Run: ./scripts/bump-version.sh ${TAG_BASE} && git add VERSION ui/meson.build engine/package.json ui/data/io.github.ronki2304.ProtonDriveLinuxClient.metainfo.xml && git commit -m 'chore: bump version to ${TAG_BASE}' && git push"
            exit 1
          fi
          echo "✓ Version ${FILE_VERSION} matches tag ${GITHUB_REF_NAME}"

      - name: Install Flatpak dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6
        with:
          bundle: io.github.ronki2304.ProtonDriveLinuxClient.flatpak
          manifest-path: flatpak/io.github.ronki2304.ProtonDriveLinuxClient.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: io.github.ronki2304.ProtonDriveLinuxClient.flatpak
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
